<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1000" fill="none" stroke="#C9CFD9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Original whiteboard-video doodle wall for the auth screens. Own work, 2026-10-20. -->
  <defs>
    <path id="star" d="M0 -22 L6 -7 L22 -6 L10 4 L14 20 L0 11 L-14 20 L-10 4 L-22 -6 L-6 -7 Z"/>
  </defs>

  <!-- clapperboard -->
  <g transform="translate(60 48) rotate(-8)">
    <rect x="0" y="40" width="170" height="120" rx="8"/>
    <path d="M0 40 L170 40 L166 6 L-4 6 Z"/>
    <path d="M22 6 L40 40 M62 6 L80 40 M102 6 L120 40 M142 6 L160 40"/>
    <path d="M20 80 H120 M20 105 H92 M20 130 H140"/>
  </g>

  <!-- light bulb -->
  <g transform="translate(285 14) scale(0.52)" stroke-width="6">
    <path d="M110,282 C110,240 60,215 60,150 A90,90 0 1 1 240,150 C240,215 190,240 190,282"/>
    <path d="M110,282 L190,282 M113,304 L187,304 M116,326 L184,326 M126,346 Q150,372 174,346"/>
    <path d="M128,282 L128,200 C128,178 150,178 150,200 C150,178 172,178 172,200 L172,282"/>
    <path d="M53,94 L27,79 M94,53 L79,27 M150,38 L150,8 M206,53 L221,27 M247,94 L273,79"/>
  </g>

  <!-- rain cloud -->
  <g transform="translate(470 46)">
    <path d="M30 90 C0 90 0 50 30 50 C30 20 80 15 92 40 C105 10 160 15 158 52 C190 52 195 90 165 90 Z"/>
    <path d="M60 110 l-6 16 M100 112 l-4 18 M140 110 l-6 16"/>
  </g>

  <!-- rocket -->
  <g transform="translate(712 26) rotate(18) scale(0.44)" stroke-width="7">
    <path d="M130,22 C192,72 202,172 186,262 L74,262 C58,172 68,72 130,22 Z"/>
    <circle cx="130" cy="132" r="30"/>
    <path d="M78,204 L34,288 L80,264 M182,204 L226,288 L180,264 M96,262 L106,294 L154,294 L164,262"/>
    <path d="M112,306 Q118,344 130,378 Q142,344 148,306"/>
  </g>

  <!-- speech bubble -->
  <g transform="translate(34 250) rotate(-4)">
    <path d="M20 0 H150 Q170 0 170 20 V80 Q170 100 150 100 H70 L40 130 L45 100 H20 Q0 100 0 80 V20 Q0 0 20 0 Z"/>
    <text x="50" y="68" font-family="'Marker Felt','Chalkboard SE','Comic Sans MS',cursive" font-size="48" stroke-width="2.5">Hi!</text>
  </g>

  <!-- big lettering, with a lighter offset echo for depth -->
  <g font-family="'Marker Felt','Chalkboard SE','Comic Sans MS',cursive" font-size="196" font-weight="700" transform="rotate(-6 460 400)">
    <text x="196" y="478" stroke="#E4E7EC" stroke-width="4">Draw!</text>
    <text x="188" y="470" stroke-width="4">Draw!</text>
  </g>

  <use href="#star" x="244" y="262"/>
  <use href="#star" x="772" y="320"/>
  <use href="#star" x="118" y="548"/>
  <use href="#star" x="420" y="980"/>

  <!-- play button -->
  <g transform="translate(150 660)">
    <circle r="70"/>
    <circle r="84" stroke-dasharray="6 12"/>
    <path d="M-22 -35 L40 0 L-22 35 Z"/>
  </g>

  <!-- microphone with sound waves -->
  <g transform="translate(296 560)">
    <rect x="20" y="0" width="60" height="100" rx="30"/>
    <path d="M30 30 H70 M30 50 H70 M30 70 H70"/>
    <path d="M0 70 Q0 140 50 140 Q100 140 100 70 M50 140 V175 M20 178 H80"/>
    <path d="M115 30 Q130 50 115 70 M132 14 Q158 50 132 86"/>
  </g>

  <!-- film strip -->
  <g transform="translate(450 548) rotate(-5)">
    <rect x="0" y="0" width="350" height="92" rx="6"/>
    <path d="M14 8 h14 v12 h-14 Z M52 8 h14 v12 h-14 Z M90 8 h14 v12 h-14 Z M128 8 h14 v12 h-14 Z M166 8 h14 v12 h-14 Z M204 8 h14 v12 h-14 Z M242 8 h14 v12 h-14 Z M280 8 h14 v12 h-14 Z M318 8 h14 v12 h-14 Z"/>
    <path d="M14 72 h14 v12 h-14 Z M52 72 h14 v12 h-14 Z M90 72 h14 v12 h-14 Z M128 72 h14 v12 h-14 Z M166 72 h14 v12 h-14 Z M204 72 h14 v12 h-14 Z M242 72 h14 v12 h-14 Z M280 72 h14 v12 h-14 Z M318 72 h14 v12 h-14 Z"/>
    <rect x="16" y="28" width="98" height="36" rx="3"/>
    <rect x="126" y="28" width="98" height="36" rx="3"/>
    <rect x="236" y="28" width="98" height="36" rx="3"/>
  </g>

  <!-- heart -->
  <g transform="translate(470 690)">
    <path d="M60 100 C10 65 0 30 25 12 C45 -2 60 15 60 28 C60 15 75 -2 95 12 C120 30 110 65 60 100 Z"/>
    <path d="M60 100 C10 65 0 30 25 12 C45 -2 60 15 60 28 C60 15 75 -2 95 12 C120 30 110 65 60 100 Z" transform="translate(12 13) scale(0.8)" stroke="#E4E7EC"/>
  </g>

  <!-- paper plane with a looping dashed trail -->
  <g transform="translate(650 660) rotate(-10)">
    <path d="M0 50 L140 0 L100 110 L70 75 Z M140 0 L70 75 L66 108 L84 86"/>
    <path d="M-10 70 C-60 90 -80 40 -42 30 C-10 22 -22 80 -110 96" stroke-dasharray="8 10"/>
  </g>

  <!-- pencil -->
  <g transform="translate(70 870) rotate(-24)">
    <rect x="0" y="0" width="180" height="34"/>
    <path d="M180 0 L226 17 L180 34 M212 12 L226 17 L212 22 M0 17 H180"/>
    <path d="M0 0 H-28 Q-36 0 -36 8 V26 Q-36 34 -28 34 H0 M-7 0 V34 M-15 0 V34"/>
  </g>

  <!-- coffee mug -->
  <g transform="translate(300 822)">
    <path d="M0 0 H100 V90 Q100 120 70 120 H30 Q0 120 0 90 Z"/>
    <path d="M100 25 Q140 25 140 55 Q140 85 100 85"/>
    <path d="M30 -15 Q20 -35 35 -50 M55 -15 Q45 -35 60 -55 M80 -15 Q70 -35 85 -50"/>
    <path d="M-25 132 H125"/>
  </g>

  <!-- smiley -->
  <g transform="translate(536 880)">
    <circle r="55"/>
    <circle cx="-20" cy="-15" r="5" fill="#C9CFD9" stroke="none"/>
    <circle cx="20" cy="-15" r="5" fill="#C9CFD9" stroke="none"/>
    <path d="M-30 10 Q0 40 30 10"/>
  </g>

  <!-- curly arrow -->
  <g transform="translate(630 860)">
    <path d="M0 60 C40 -10 90 -10 100 40 C108 80 60 85 70 45 C80 10 140 5 170 40"/>
    <path d="M170 40 L145 38 M170 40 L163 16"/>
  </g>

  <text x="660" y="988" font-family="'Marker Felt','Chalkboard SE','Comic Sans MS',cursive" font-size="44" stroke-width="2.5" transform="rotate(-8 700 975)">wow</text>
</svg>
